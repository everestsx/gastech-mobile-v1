name: Appium QA Tests

on:
  push:
    branches: [qa]
  pull_request:
    branches: [qa]

concurrency:
  group: appium-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium-tests:
    name: Appium Tests (QA Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_VARIANT: stage
      TEST_DRIVER_CODE: ${{ secrets.TEST_DRIVER_CODE }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - run: npm ci
      - run: npm install -g appium && appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            appium &
            sleep 10
            npm run test:e2e
        continue-on-error: true
        id: appium-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-report-${{ github.run_number }}
          path: e2e/allure-results/
          retention-days: 30

      - name: Fail if tests failed
        if: steps.appium-run.outcome == 'failure'
        run: exit 1
